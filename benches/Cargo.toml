[package]
name = "jet3-benches"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.96"

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false }
jet3 = { path = "../crates/jet3" }
tempfile = "=3.27.0"

[[bench]]
name = "format_primitives"
path = "format_primitives.rs"
harness = false

[[bench]]
name = "binary_writer"
path = "binary_writer_benchmark.rs"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

# Keep Criterion and benchmark-only dependencies out of the production
# workspace and its lockfile.
[workspace]
