name: Windows DAO A3 campaign

on:
  workflow_dispatch:
    inputs:
      execute_a3_campaign:
        description: Authorize the licensed A3 three-replica acquisition
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-dao-a3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate the checked A3 contract
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.7"

      - name: Parse checked A3 PowerShell sources without execution
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          if ($PSVersionTable.PSEdition -cne "Desktop" -or
              $PSVersionTable.PSVersion.Major -ne 5) {
            throw "A3 contract parsing requires Windows PowerShell 5 Desktop."
          }
          $entrypoint = "oracle/windows-dao/scripts/run-a3-replica.ps1"
          $a3Directory = "oracle/windows-dao/scripts/a3"
          if (-not (Test-Path -LiteralPath $entrypoint -PathType Leaf) -or
              -not (Test-Path -LiteralPath $a3Directory -PathType Container)) {
            throw "The checked A3 PowerShell source inventory is incomplete."
          }
          $sourcePaths = @($entrypoint) + @(
            Get-ChildItem -LiteralPath $a3Directory -Filter "*.ps1" -File |
              Sort-Object -Property Name |
              ForEach-Object { $_.FullName }
          )
          if ($sourcePaths.Count -lt 2 -or $sourcePaths.Count -gt 32) {
            throw "The checked A3 PowerShell source count violates its bound."
          }
          foreach ($sourcePath in $sourcePaths) {
            $item = Get-Item -LiteralPath $sourcePath -Force
            if ($item.PSIsContainer -or $item.Length -lt 1 -or
                $item.Length -gt 2MB -or
                ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "A checked A3 PowerShell source violates its file bound."
            }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $item.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if (@($errors).Count -ne 0) {
              [string]$detail = [Convert]::ToString((@($errors | ForEach-Object {
                "line $($_.Extent.StartLineNumber): $($_.Message)"
              }) -join "; "))
              if ($detail.Length -gt 2000) {
                $detail = $detail.Substring(0, 2000)
              }
              throw "A3 PowerShell parser errors in $sourcePath`: $detail"
            }
          }

      - name: Run the checked A3 Python contract tests
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & python -B oracle/windows-dao/scripts/a3_spec.py `
            oracle/windows-dao/experiments/a3/a3-allocation-maps.plan.json
          if ($LASTEXITCODE -ne 0) { throw "The checked A3 plan failed." }
          $planPath = "oracle/windows-dao/experiments/a3/a3-allocation-maps.plan.json"
          $plan = (Get-Content -LiteralPath $planPath -Raw) | ConvertFrom-Json
          if ([string]$plan.experiment_id -cne "DAO-A3-ALLOCATION-MAPS-001") {
            throw "The A3 workflow refuses a plan whose experiment_id is not A3."
          }
          & python -B -m unittest `
            oracle/windows-dao/tests/test_a3_plan_contract.py `
            oracle/windows-dao/tests/test_a3_powershell_contract.py `
            oracle/windows-dao/tests/test_windows_dao_a3_workflow.py
          if ($LASTEXITCODE -ne 0) {
            throw "The checked A3 contract tests failed."
          }

  a3-replica:
    name: Acquire A3 replica ${{ matrix.replica }}
    needs: contract
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.execute_a3_campaign &&
      needs.contract.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        replica: [1, 2, 3]
    runs-on: windows-2022
    timeout-minutes: 37
    env:
      FROZEN_WORKER_TIMEOUT_SECONDS: "1700"
      HOSTED_REPLICA_TIMEOUT_SECONDS: "2120"
      FROZEN_CAMPAIGN_TIMEOUT_SECONDS: "2700"
      REPLICA_MAXIMUM_OUTPUT_BYTES: "1048576"
      FROZEN_PLAN_SHA256: "b16f78436bdfea701451880a9b761b3e3aaf1b3ea0b62fef32a6afde22e05cb1"
      FROZEN_REVISION_PLAN_SHA256: "03cdfe0dde1563d386c646d844e9383637547ca0e5321ef29bac264dfcc6bf3b"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.7"

      - name: Bind the exact clean pushed producer commit
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REPOSITORY -cne "oglassdev/jet3-rs") {
            throw "The workflow repository differs from the canonical repository."
          }
          & git remote set-url origin https://github.com/oglassdev/jet3-rs.git
          if ($LASTEXITCODE -ne 0) { throw "Could not bind the canonical origin." }
          $head = (& git rev-parse --verify HEAD).Trim()
          $origin = (& git remote get-url origin).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA -or
              $origin -cne "https://github.com/oglassdev/jet3-rs.git") {
            throw "The checkout identity differs from the dispatched commit."
          }
          $remoteRows = @(& git ls-remote --exit-code origin refs/heads/main)
          if ($LASTEXITCODE -ne 0 -or $remoteRows.Count -ne 1) {
            throw "The pushed main-branch identity is unavailable."
          }
          $remoteFields = @($remoteRows[0] -split "\s+")
          if ($remoteFields.Count -ne 2 -or $remoteFields[0] -cne $env:GITHUB_SHA) {
            throw "The dispatched producer commit is not the pushed main commit."
          }
          $dirty = @(& git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) {
            throw "The A3 producer checkout is not exact and clean."
          }

      - name: Run bounded A3 replica ${{ matrix.replica }}
        id: replica
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          . "oracle/windows-dao/scripts/remote/Remote.Process.ps1"

          function Get-A3LogBytes {
            param([Parameter(Mandatory = $true)][string[]]$Paths)
            [long]$total = 0
            foreach ($path in $Paths) {
              if (Test-Path -LiteralPath $path -PathType Leaf) {
                [long]$length = (Get-Item -LiteralPath $path -Force).Length
                if ($length -gt ([long]::MaxValue - $total)) {
                  throw "A3 log byte accounting overflowed."
                }
                $total += $length
              }
            }
            return $total
          }

          $repository = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $replica = [int]${{ matrix.replica }}
          $replicaName = $replica.ToString("00")
          $outputRoot = Join-Path $env:RUNNER_TEMP "jet3-a3-output-$replicaName"
          $diagnostics = Join-Path $env:RUNNER_TEMP "jet3-a3-diagnostics-$replicaName"
          New-Item -ItemType Directory -Path $outputRoot, $diagnostics | Out-Null
          $stdoutPath = Join-Path $diagnostics "replica.stdout.log"
          $stderrPath = Join-Path $diagnostics "replica.stderr.log"
          $hostedRecord = [ordered]@{
            document_type = "jet3_windows_dao_a3_hosted_replica"
            producer_commit = $env:GITHUB_SHA
            campaign_id = "a3-run-$env:GITHUB_RUN_ID"
            plan_sha256 = $env:FROZEN_PLAN_SHA256
            revision_plan_sha256 = $env:FROZEN_REVISION_PLAN_SHA256
            replica = $replica
            worker_timeout_seconds = [int]$env:FROZEN_WORKER_TIMEOUT_SECONDS
            hosted_timeout_seconds = [int]$env:HOSTED_REPLICA_TIMEOUT_SECONDS
            campaign_timeout_seconds = [int]$env:FROZEN_CAMPAIGN_TIMEOUT_SECONDS
            started_utc = [DateTimeOffset]::UtcNow.ToString("o")
          }
          [IO.File]::WriteAllText(
            (Join-Path $diagnostics "hosted-replica.json"),
            ($hostedRecord | ConvertTo-Json -Compress),
            (New-Object Text.UTF8Encoding($false))
          )
          $x86PowerShell = Join-Path $env:WINDIR `
            "SysWOW64\WindowsPowerShell\v1.0\powershell.exe"
          $entrypoint = Join-Path $repository `
            "oracle/windows-dao/scripts/run-a3-replica.ps1"
          if (-not (Test-Path -LiteralPath $x86PowerShell -PathType Leaf)) {
            throw "x86 Windows PowerShell 5 is unavailable."
          }
          $process = $null
          $clock = $null
          $replicaExit = $null
          $replicaError = $null
          $cleanupErrors = New-Object Collections.ArrayList
          $elapsedSeconds = 0.0
          try {
            $process = Start-Process -FilePath $x86PowerShell -PassThru `
              -RedirectStandardOutput $stdoutPath `
              -RedirectStandardError $stderrPath `
              -ArgumentList @(
                "-NoLogo", "-NoProfile", "-NonInteractive",
                "-ExecutionPolicy", "Bypass", "-File", $entrypoint,
                "-RepositoryRoot", $repository,
                "-OutputRoot", $outputRoot,
                "-DiagnosticsRoot", $diagnostics,
                "-GitCommit", $env:GITHUB_SHA,
                "-RunId", $env:GITHUB_RUN_ID,
                "-Replica", $replica,
                "-MatrixJobId", "a3-replica-$replica"
              )
            $null = $process.Handle
            $clock = [Diagnostics.Stopwatch]::StartNew()
            while (-not $process.WaitForExit(1000)) {
              if ((Get-A3LogBytes -Paths @($stdoutPath, $stderrPath)) -gt
                  [long]$env:REPLICA_MAXIMUM_OUTPUT_BYTES) {
                throw "A3 replica output exceeded its byte ceiling."
              }
              if ($clock.Elapsed.TotalSeconds -ge
                  [int]$env:HOSTED_REPLICA_TIMEOUT_SECONDS) {
                throw "A3 replica exceeded its hosted wall-clock ceiling."
              }
            }
            if ((Get-A3LogBytes -Paths @($stdoutPath, $stderrPath)) -gt
                [long]$env:REPLICA_MAXIMUM_OUTPUT_BYTES) {
              throw "A3 replica output exceeded its byte ceiling."
            }
            $process.WaitForExit()
            $process.Refresh()
            $exitCode = $process.ExitCode
            if ($null -eq $exitCode) {
              throw "A3 replica exit code was unavailable after completion."
            }
            $replicaExit = [int]$exitCode
          }
          catch {
            $replicaError = $_
          }
          finally {
            if ($null -ne $process) {
              try {
                Stop-Jet3BootstrapProcessTree -Process $process `
                  -Label "A3 hosted replica $replica"
              }
              catch { [void]$cleanupErrors.Add($_) }
            }
            if ($null -ne $clock) {
              $clock.Stop()
              $elapsedSeconds = $clock.Elapsed.TotalSeconds
            }
            if ($null -ne $process) {
              try { $process.Dispose() }
              catch { [void]$cleanupErrors.Add($_) }
            }
            try {
              $hostedRecord.completed_utc = [DateTimeOffset]::UtcNow.ToString("o")
              $hostedRecord.elapsed_seconds = [Math]::Round($elapsedSeconds, 3)
              [IO.File]::WriteAllText(
                (Join-Path $diagnostics "hosted-replica.json"),
                ($hostedRecord | ConvertTo-Json -Compress),
                (New-Object Text.UTF8Encoding($false))
              )
            }
            catch { [void]$cleanupErrors.Add($_) }
          }
          if ($null -ne $replicaError) { throw $replicaError }
          if ($cleanupErrors.Count -ne 0) {
            throw "A3 hosted replica cleanup failed."
          }
          if ($replicaExit -ne 0) {
            throw "The checked A3 replica worker returned nonzero."
          }
          $dirty = @(& git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) {
            throw "A3 acquisition changed the exact producer checkout."
          }

      - name: Upload retained A3 replica tree
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-dao-a3-replica-${{ matrix.replica }}
          path: ${{ runner.temp }}\jet3-a3-output-0${{ matrix.replica }}
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90

      - name: Upload bounded A3 replica diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-dao-a3-diagnostics-${{ matrix.replica }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\jet3-a3-diagnostics-0${{ matrix.replica }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  fan-in:
    name: Assemble and analyze the complete A3 bundle
    needs: [contract, a3-replica]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.execute_a3_campaign &&
      needs.contract.result == 'success' &&
      needs.a3-replica.result == 'success'
    runs-on: windows-2022
    # Equals the plan's fan_in_timeout_seconds bound (900 s).
    timeout-minutes: 15
    env:
      FROZEN_CAMPAIGN_TIMEOUT_SECONDS: "2700"
      FROZEN_PLAN_SHA256: "b16f78436bdfea701451880a9b761b3e3aaf1b3ea0b62fef32a6afde22e05cb1"
      FROZEN_REVISION_PLAN_SHA256: "03cdfe0dde1563d386c646d844e9383637547ca0e5321ef29bac264dfcc6bf3b"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.7"

      - name: Bind the hosted run-attempt start observable
        id: campaign_start
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $diagnostics = Join-Path $env:RUNNER_TEMP "jet3-a3-fanin-diagnostics"
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/" +
            "$env:GITHUB_RUN_ID/attempts/$env:GITHUB_RUN_ATTEMPT"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $attempt = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
          $started = [string]$attempt.run_started_at
          if ([string]$attempt.id -cne $env:GITHUB_RUN_ID -or
              [string]$attempt.run_attempt -cne $env:GITHUB_RUN_ATTEMPT -or
              $started -cnotmatch "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$") {
            throw "The hosted run-attempt start observable is unavailable or unbound."
          }
          $record = [ordered]@{
            document_type = "jet3_windows_dao_a3_campaign_start"
            producer_commit = $env:GITHUB_SHA
            github_run_id = $env:GITHUB_RUN_ID
            github_run_attempt = $env:GITHUB_RUN_ATTEMPT
            run_started_at = $started
          }
          [IO.File]::WriteAllText(
            (Join-Path $diagnostics "campaign-start.json"),
            (($record | ConvertTo-Json -Compress) + "`n"),
            (New-Object Text.UTF8Encoding($false))
          )
          "run_started_at=$started" | Out-File -FilePath $env:GITHUB_OUTPUT `
            -Encoding utf8 -Append

      - name: Download A3 replica 1
        id: download_replica_1
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-dao-a3-replica-1
          path: ${{ runner.temp }}\jet3-a3-replicas\replica-01
          # The closed replica manifest is re-hashed by assemble; the zip digest is advisory.
          digest-mismatch: warn

      - name: Download A3 replica 1 through the REST fallback
        if: steps.download_replica_1.outcome == 'failure'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & oracle/windows-dao/scripts/a3/Download-A3Artifact.ps1 `
            -ArtifactName "windows-dao-a3-replica-1" `
            -Destination (Join-Path $env:RUNNER_TEMP "jet3-a3-replicas\replica-01")

      - name: Require A3 replica 1 download
        if: always()
        shell: powershell
        run: |
          $replica = Join-Path $env:RUNNER_TEMP "jet3-a3-replicas\replica-01"
          if (-not (Test-Path -LiteralPath $replica -PathType Container)) {
            throw "Neither A3 replica 1 download produced its directory."
          }

      - name: Download A3 replica 2
        id: download_replica_2
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-dao-a3-replica-2
          path: ${{ runner.temp }}\jet3-a3-replicas\replica-02
          # The closed replica manifest is re-hashed by assemble; the zip digest is advisory.
          digest-mismatch: warn

      - name: Download A3 replica 2 through the REST fallback
        if: steps.download_replica_2.outcome == 'failure'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & oracle/windows-dao/scripts/a3/Download-A3Artifact.ps1 `
            -ArtifactName "windows-dao-a3-replica-2" `
            -Destination (Join-Path $env:RUNNER_TEMP "jet3-a3-replicas\replica-02")

      - name: Require A3 replica 2 download
        if: always()
        shell: powershell
        run: |
          $replica = Join-Path $env:RUNNER_TEMP "jet3-a3-replicas\replica-02"
          if (-not (Test-Path -LiteralPath $replica -PathType Container)) {
            throw "Neither A3 replica 2 download produced its directory."
          }

      - name: Assemble the two derivation replica trees
        id: assemble
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $replicas = Join-Path $env:RUNNER_TEMP "jet3-a3-replicas"
          $bundle = Join-Path $env:RUNNER_TEMP "jet3-a3-bundle"
          $campaignId = "a3-run-$env:GITHUB_RUN_ID"
          & python -B oracle/windows-dao/scripts/a3_bundle.py assemble `
            --replica-root (Join-Path $replicas "replica-01") `
            --replica-root (Join-Path $replicas "replica-02") `
            --bundle-root $bundle --campaign-id $campaignId `
            --producer-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "A3 replica assembly failed." }

      - name: Freeze derivation candidates before any replica 3 artifact download
        id: freeze
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path $env:RUNNER_TEMP "jet3-a3-bundle"
          $diagnostics = Join-Path $env:RUNNER_TEMP "jet3-a3-fanin-diagnostics"
          $holdoutArtifact = Join-Path $env:RUNNER_TEMP "jet3-a3-holdout\replica-03"
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          $summary = @(& python -B oracle/windows-dao/scripts/a3_analysis.py `
            --freeze-only `
            --bundle-root $bundle `
            --replica (Join-Path $bundle "observations/replica-01.json") `
            --replica (Join-Path $bundle "observations/replica-02.json") `
            --candidate-output (Join-Path $bundle "analysis/derivation-candidates.json") `
            --freeze-state (Join-Path $diagnostics "freeze-phase.json") `
            --holdout-artifact-path $holdoutArtifact)
          if ($LASTEXITCODE -ne 0) { throw "A3 derivation freeze failed." }
          [IO.File]::WriteAllText(
            (Join-Path $diagnostics "freeze-summary.json"),
            (($summary -join "`n") + "`n"),
            (New-Object Text.UTF8Encoding($false))
          )

      - name: Download A3 holdout replica 3 outside the bundle
        id: download_replica_3
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-dao-a3-replica-3
          path: ${{ runner.temp }}\jet3-a3-holdout\replica-03
          # The preceding step has retained and recorded the frozen-set digest.
          digest-mismatch: warn

      - name: Download A3 holdout replica 3 through the REST fallback
        if: steps.download_replica_3.outcome == 'failure'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & oracle/windows-dao/scripts/a3/Download-A3Artifact.ps1 `
            -ArtifactName "windows-dao-a3-replica-3" `
            -Destination (Join-Path $env:RUNNER_TEMP "jet3-a3-holdout\replica-03")

      - name: Require A3 replica 3 download
        if: always()
        shell: powershell
        run: |
          $replica = Join-Path $env:RUNNER_TEMP "jet3-a3-holdout\replica-03"
          if (-not (Test-Path -LiteralPath $replica -PathType Container)) {
            throw "Neither A3 replica 3 download produced its directory."
          }

      - name: Graft and structurally validate the holdout against retained frozen bytes
        id: holdout
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path $env:RUNNER_TEMP "jet3-a3-bundle"
          $diagnostics = Join-Path $env:RUNNER_TEMP "jet3-a3-fanin-diagnostics"
          $freezeStatePath = Join-Path $diagnostics "freeze-phase.json"
          $freezeState = Get-Content -LiteralPath $freezeStatePath -Raw | ConvertFrom-Json
          & python -B oracle/windows-dao/scripts/a3_holdout.py `
            --bundle-root $bundle `
            --holdout-replica-root (Join-Path $env:RUNNER_TEMP "jet3-a3-holdout\replica-03") `
            --candidate-set (Join-Path $bundle "analysis/derivation-candidates.json") `
            --candidate-sha256 $freezeState.derivation_candidate_set_sha256 `
            --campaign-id "a3-run-$env:GITHUB_RUN_ID" `
            --producer-commit $env:GITHUB_SHA `
            --freeze-state $freezeStatePath `
            --output (Join-Path $bundle "analysis/holdout-structure-receipt.json")
          if ($LASTEXITCODE -ne 0) { throw "A3 holdout structural validation failed." }

      - name: Resume analysis from the retained frozen candidate set
        id: analyze
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path $env:RUNNER_TEMP "jet3-a3-bundle"
          & python -B oracle/windows-dao/scripts/a3_analysis.py `
            --resume `
            --bundle-root $bundle `
            --replica (Join-Path $bundle "observations/replica-03.json") `
            --candidate-output (Join-Path $bundle "analysis/derivation-candidates.json") `
            --holdout-receipt (Join-Path $bundle "analysis/holdout-structure-receipt.json") `
            --freeze-state (Join-Path $env:RUNNER_TEMP "jet3-a3-fanin-diagnostics\freeze-phase.json") `
            --output (Join-Path $bundle "analysis/analysis-report.json")
          if ($LASTEXITCODE -ne 0) { throw "A3 analysis failed." }

      - name: Finalize the retained A3 bundle manifest
        id: finalize
        shell: powershell
        env:
          CAMPAIGN_STARTED_UTC: ${{ steps.campaign_start.outputs.run_started_at }}
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path $env:RUNNER_TEMP "jet3-a3-bundle"
          $diagnostics = Join-Path $env:RUNNER_TEMP "jet3-a3-fanin-diagnostics"
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          $summary = @(& python -B oracle/windows-dao/scripts/a3_bundle.py finalize `
            --bundle-root $bundle `
            --campaign-id "a3-run-$env:GITHUB_RUN_ID" `
            --producer-commit $env:GITHUB_SHA `
            --campaign-started-utc $env:CAMPAIGN_STARTED_UTC)
          if ($LASTEXITCODE -ne 0) { throw "A3 bundle finalization failed." }
          [IO.File]::WriteAllText(
            (Join-Path $diagnostics "finalize-summary.json"),
            (($summary -join "`n") + "`n"),
            (New-Object Text.UTF8Encoding($false))
          )

      - name: Validate the complete A3 bundle with the producer contract
        id: validate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path $env:RUNNER_TEMP "jet3-a3-bundle"
          & python -B oracle/windows-dao/scripts/a3_bundle.py validate $bundle `
            --campaign-id "a3-run-$env:GITHUB_RUN_ID" `
            --producer-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "Complete A3 bundle contract validation failed."
          }
          $dirty = @(& git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) {
            throw "A3 fan-in changed the exact producer checkout."
          }

      - name: Independently recompute the retained A3 bundle
        id: independent
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path $env:RUNNER_TEMP "jet3-a3-bundle"
          $report = Join-Path $env:RUNNER_TEMP `
            "jet3-a3-fanin-diagnostics\validation\independent-validation-report.json"
          & python -B oracle/windows-dao/scripts/a3_independent_validator.py `
            --bundle-root $bundle `
            --plan oracle/windows-dao/experiments/a3/a3-allocation-maps.plan.json `
            --revision oracle/windows-dao/experiments/a3/a3-allocation-maps-r5.plan.json `
            --validator-commit $env:GITHUB_SHA `
            --output $report
          if ($LASTEXITCODE -ne 0) {
            throw "The independent recomputing A3 validator rejected the bundle."
          }

      - name: Record retained A3 fan-in status
        id: fan_in_status
        if: always()
        shell: powershell
        env:
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          FREEZE_OUTCOME: ${{ steps.freeze.outcome }}
          HOLDOUT_OUTCOME: ${{ steps.holdout.outcome }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          INDEPENDENT_OUTCOME: ${{ steps.independent.outcome }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $diagnostics = Join-Path $env:RUNNER_TEMP "jet3-a3-fanin-diagnostics"
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          $completed = [DateTimeOffset]::UtcNow
          $campaignElapsed = $null
          $campaignStarted = $null
          $bundleCreated = $null
          $timingComplete = $false
          try {
            $startPath = Join-Path $diagnostics "campaign-start.json"
            $manifestPath = Join-Path $env:RUNNER_TEMP "jet3-a3-bundle\bundle-manifest.json"
            $startItem = Get-Item -LiteralPath $startPath -Force
            $manifestItem = Get-Item -LiteralPath $manifestPath -Force
            if ($startItem.Length -lt 1 -or $startItem.Length -gt 4096 -or
                $manifestItem.Length -lt 1 -or $manifestItem.Length -gt 64MB) {
              throw "Campaign timing input violates its byte bound."
            }
            $startRecord = Get-Content -LiteralPath $startPath -Raw | ConvertFrom-Json
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            if ([string]$startRecord.producer_commit -cne $env:GITHUB_SHA -or
                [string]$startRecord.github_run_id -cne $env:GITHUB_RUN_ID -or
                [string]$startRecord.github_run_attempt -cne $env:GITHUB_RUN_ATTEMPT -or
                [string]$manifest.campaign_id -cne "a3-run-$env:GITHUB_RUN_ID" -or
                [string]$manifest.campaign_started_utc -cne
                  [string]$startRecord.run_started_at) {
              throw "Campaign timing binding mismatch."
            }
            $campaignStarted = [DateTimeOffset]::Parse([string]$manifest.campaign_started_utc)
            $bundleCreated = [DateTimeOffset]::Parse([string]$manifest.created_utc)
            $campaignElapsed = [long][Math]::Floor(
              ($bundleCreated - $campaignStarted).TotalSeconds
            )
            $timingComplete = $campaignElapsed -ge 0 -and
              $campaignElapsed -eq [long]$manifest.campaign_elapsed_seconds
          }
          catch {
            $timingComplete = $false
          }
          $withinPlan = $timingComplete -and `
            $campaignElapsed -le [int]$env:FROZEN_CAMPAIGN_TIMEOUT_SECONDS
          $contractPassed = (
            $env:ASSEMBLE_OUTCOME -ceq "success" -and
            $env:FREEZE_OUTCOME -ceq "success" -and
            $env:HOLDOUT_OUTCOME -ceq "success" -and
            $env:ANALYZE_OUTCOME -ceq "success" -and
            $env:FINALIZE_OUTCOME -ceq "success" -and
            $env:VALIDATE_OUTCOME -ceq "success"
          )
          $bundleStatus = $null
          $summaryPath = Join-Path $diagnostics "finalize-summary.json"
          if (Test-Path -LiteralPath $summaryPath -PathType Leaf) {
            try {
              $summaryItem = Get-Item -LiteralPath $summaryPath -Force
              if ($summaryItem.Length -lt 1 -or $summaryItem.Length -gt 4096) {
                throw "Finalize summary violates its byte bound."
              }
              $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
              $bundleStatus = [string]$summary.bundle_status
            }
            catch { $bundleStatus = $null }
          }
          $independentAccepted = $false
          $independentStatus = "not_independently_validated"
          $discrepancyCodes = @()
          $reportPath = Join-Path $diagnostics `
            "validation\independent-validation-report.json"
          if (Test-Path -LiteralPath $reportPath -PathType Leaf) {
            try {
              $reportItem = Get-Item -LiteralPath $reportPath -Force
              if ($reportItem.Length -lt 1 -or $reportItem.Length -gt 65536) {
                throw "Independent validation report violates its byte bound."
              }
              $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
              if ([string]$report.document_type -cne
                    "dao_a3_independent_validation_report" -or
                  [string]$report.campaign_id -cne "a3-run-$env:GITHUB_RUN_ID") {
                throw "Independent validation report binding mismatch."
              }
              $independentAccepted = ($report.accepted -eq $true)
              $independentStatus = [string]$report.independent_validation_status
              $discrepancyCodes = @($report.discrepancy_codes | Select-Object -First 8)
            }
            catch {
              $independentAccepted = $false
              $independentStatus = "not_independently_validated"
              $discrepancyCodes = @("report_unreadable")
            }
          }
          if ($env:INDEPENDENT_OUTCOME -cne "success") { $independentAccepted = $false }
          $status = [ordered]@{
            document_type = "jet3_windows_dao_a3_fan_in_status"
            producer_commit = $env:GITHUB_SHA
            campaign_id = "a3-run-$env:GITHUB_RUN_ID"
            plan_sha256 = $env:FROZEN_PLAN_SHA256
            revision_plan_sha256 = $env:FROZEN_REVISION_PLAN_SHA256
            assemble = $env:ASSEMBLE_OUTCOME
            freeze = $env:FREEZE_OUTCOME
            holdout = $env:HOLDOUT_OUTCOME
            analyze = $env:ANALYZE_OUTCOME
            finalize = $env:FINALIZE_OUTCOME
            validate = $env:VALIDATE_OUTCOME
            independent = $env:INDEPENDENT_OUTCOME
            producer_contract_passed = $contractPassed
            bundle_status = $bundleStatus
            independent_validation_accepted = $independentAccepted
            independent_validation_status = $independentStatus
            independent_validation_discrepancy_codes = $discrepancyCodes
            timing_records_complete = $timingComplete
            campaign_started_utc = if ($null -eq $campaignStarted) {
              $null
            } else { $campaignStarted.ToString("o") }
            bundle_created_utc = if ($null -eq $bundleCreated) {
              $null
            } else { $bundleCreated.ToString("o") }
            campaign_elapsed_seconds = $campaignElapsed
            plan_campaign_timeout_seconds = `
              [int]$env:FROZEN_CAMPAIGN_TIMEOUT_SECONDS
            within_plan_campaign_timeout = $withinPlan
            completed_utc = $completed.ToString("o")
            github_run_id = $env:GITHUB_RUN_ID
            github_run_attempt = $env:GITHUB_RUN_ATTEMPT
          }
          $statusJson = ($status | ConvertTo-Json -Depth 3 -Compress) + "`n"
          $statusBytes = [Text.Encoding]::UTF8.GetBytes($statusJson)
          if ($statusBytes.Length -gt 4096) {
            throw "A3 fan-in status exceeds its byte ceiling."
          }
          [IO.File]::WriteAllBytes(
            (Join-Path $diagnostics "fan-in-status.json"),
            $statusBytes
          )
          if (-not $withinPlan) {
            throw "A3 campaign exceeded the plan's campaign timeout or lacks complete timing."
          }

      - name: Upload retained A3 bundle
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-dao-a3-bundle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\jet3-a3-bundle
            ${{ runner.temp }}\jet3-a3-fanin-diagnostics\fan-in-status.json
            ${{ runner.temp }}\jet3-a3-fanin-diagnostics\validation\independent-validation-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload bounded A3 fan-in diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-dao-a3-fanin-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\jet3-a3-fanin-diagnostics
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
