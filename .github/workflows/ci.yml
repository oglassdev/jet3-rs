name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  validation:
    name: Validation contracts and tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Validate support matrix
        run: |
          python3 tools/validate_contract.py
          python3 tools/validate_contract.py --self-test
      - name: Test validation and acceptance tooling
        run: python3 -m unittest discover -s tools/tests -v
      - name: Validate DAO oracle protocol without claiming provider coverage
        run: |
          python3 oracle/windows-dao/scripts/validate_protocol.py schemas
          python3 -m unittest discover -s oracle/windows-dao/tests -v
      - name: Reconcile checked test inventory with Rust tests
        run: python3 tools/reconcile_tests.py --repo-root "$GITHUB_WORKSPACE"

  benchmarks:
    name: Benchmark harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      - name: Compile checked benchmarks
        run: >-
          cargo bench --manifest-path benches/Cargo.toml
          --bench format_primitives --locked --no-run
      - name: Functionally execute every checked benchmark once
        run: >-
          cargo bench --manifest-path benches/Cargo.toml
          --bench format_primitives --locked -- --test
      - name: Test benchmark manifests and comparison tooling
        run: python3 -m unittest discover -s benches/tests -v
      - name: Test benchmark metadata capture
        run: benches/tests/test_capture_metadata.sh

  fuzz:
    name: Fuzz target smoke
    runs-on: ubuntu-latest
    env:
      RUSTC_BOOTSTRAP: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Compile all checked fuzz targets
        run: cargo fuzz build --fuzz-dir fuzz
      - name: Validate fuzz registry, seed manifest, and campaign reports
        run: python3 -m unittest discover -s fuzz/tests -v
      - name: Run every registered deterministic smoke campaign
        run: python3 fuzz/tools/fuzz_campaign.py smoke

  miri:
    name: Miri library tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-20
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri setup
      - name: Interpret pure jet3 library modules
        # atomic and source tests exercise host files, permissions, and fsync, so
        # they remain covered by the three-platform core job instead of Miri.
        run: |
          for test_module in \
            binary::tests \
            error::tests \
            header::tests \
            jet3_page::tests \
            limits::tests \
            offset::tests \
            page::tests \
            resource::tests
          do
            cargo miri test --package jet3 --lib --all-features --locked "$test_module"
          done

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - run: cargo fmt --all --check
      - run: ./scripts/check-source-size.sh

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check
