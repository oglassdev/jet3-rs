name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect heavy-job paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      oracle: ${{ steps.filter.outputs.oracle }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'benches/**'
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'mise.toml'
              - 'rust-toolchain*'
              - '.github/workflows/**'
            oracle:
              - 'oracle/**'
              - 'tools/**'
              - 'docs/PROVENANCE.md'
              - 'docs/validation/**'
              - '.github/workflows/**'

  test:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace --all-targets --all-features --locked

  validation:
    name: Validation contracts and tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate support matrix
        run: python3 tools/validate_contract.py
      - name: Test validation tooling
        run: python3 -m unittest discover -s tools/tests -v
      - name: Validate DAO protocol 1.2 read inventory without claiming coverage
        run: |
          python3 -B oracle/windows-dao/scripts/build_v1_2_inventory.py --check
          python3 -B oracle/windows-dao/scripts/validate_protocol_v1_2.py schemas
          python3 -B oracle/windows-dao/scripts/validate_protocol_v1_2.py inventory oracle/windows-dao/protocol/v1_2/scenarios.json

  oracle-contracts:
    name: DAO protocol and development contracts
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.oracle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Exercise retained oracle contracts
        run: python3 -B -m unittest discover -s oracle/windows-dao/tests -v
  benchmarks:
    name: Benchmark harness
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      - name: Execute every benchmark once
        run: cargo bench --manifest-path benches/Cargo.toml --benches --locked -- --test

  fuzz:
    name: Fuzz target smoke
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-20
      - uses: Swatinem/rust-cache@v2
        id: fuzz-rust-cache
        with:
          workspaces: fuzz
          cache-directories: ~/.cargo/bin/cargo-fuzz
      - name: Install pinned cargo-fuzz for the native host
        if: steps.fuzz-rust-cache.outputs.cache-hit != 'true'
        run: >-
          cargo +nightly-2026-07-20 install cargo-fuzz
          --version 0.13.2 --locked
      - name: Run every fuzz target for 30 seconds
        run: |
          for target in $(cargo fuzz list --fuzz-dir fuzz); do
            mkdir -p "fuzz/target/corpus/$target"
            cargo fuzz run --fuzz-dir fuzz "$target" \
              "fuzz/target/corpus/$target" "fuzz/corpus/$target" \
              -- -max_total_time=30
          done
      - name: Retain fuzz crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 7

  format:
    name: Formatting and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: ./scripts/check-source-size.sh

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check
