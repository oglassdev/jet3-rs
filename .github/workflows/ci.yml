name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect heavy-job paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      oracle: ${{ steps.filter.outputs.oracle }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'benches/**'
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'mise.toml'
              - 'rust-toolchain*'
              - '.github/workflows/**'
            oracle:
              - 'oracle/**'
              - 'tools/**'
              - 'docs/PROVENANCE.md'
              - 'docs/validation/**'
              - '.github/workflows/**'

  test:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace --all-targets --all-features --locked

  validation:
    name: Validation contracts and tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate support matrix
        run: python3 tools/validate_contract.py
      - name: Test validation tooling
        run: python3 -m unittest discover -s tools/tests -v
      - name: Validate DAO protocol 1.2 read inventory without claiming coverage
        run: |
          python3 -B oracle/windows-dao/scripts/build_v1_2_inventory.py --check
          python3 -B oracle/windows-dao/scripts/validate_protocol_v1_2.py schemas
          python3 -B oracle/windows-dao/scripts/validate_protocol_v1_2.py inventory oracle/windows-dao/protocol/v1_2/scenarios.json

  oracle-contracts:
    name: DAO protocol and development contracts
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.oracle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Exercise retained oracle contracts
        run: python3 -B -m unittest discover -s oracle/windows-dao/tests -v
  benchmarks:
    name: Benchmark harness
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      - name: Compile checked benchmarks
        run: >-
          cargo bench --manifest-path benches/Cargo.toml
          --benches --locked --no-run
      - name: Functionally execute every checked benchmark once
        run: >-
          cargo bench --manifest-path benches/Cargo.toml
          --benches --locked -- --test
      - name: Test benchmark manifests and comparison tooling
        run: python3 -m unittest discover -s benches/tests -v
      - name: Test benchmark metadata capture
        run: benches/tests/test_capture_metadata.sh

  fuzz:
    name: Fuzz target smoke
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-20
      - uses: Swatinem/rust-cache@v2
        id: fuzz-rust-cache
        with:
          workspaces: fuzz
          cache-directories: ~/.cargo/bin/cargo-fuzz
      - name: Install pinned cargo-fuzz for the native host
        if: steps.fuzz-rust-cache.outputs.cache-hit != 'true'
        run: >-
          cargo +nightly-2026-07-20 install cargo-fuzz
          --version 0.13.2 --locked
      - name: Compile all checked fuzz targets
        run: cargo +nightly-2026-07-20 fuzz build --fuzz-dir fuzz
      - name: Validate fuzz registry, seed manifest, and campaign reports
        run: python3 -m unittest discover -s fuzz/tests -v
      - name: Run every registered deterministic smoke campaign
        run: |
          export RUSTC
          RUSTC="$(rustup which --toolchain nightly-2026-07-20 rustc)"
          python3 fuzz/tools/fuzz_campaign.py smoke \
            --cargo "$(rustup which --toolchain nightly-2026-07-20 cargo)" \
            --output "$RUNNER_TEMP/jet3-fuzz-smoke-$GITHUB_SHA"

  miri:
    name: Miri library tests
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-20
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly-2026-07-20 miri setup
      - name: Interpret pure jet3 library modules
        # atomic and source tests exercise host files, permissions, and fsync, so
        # they remain covered by the three-platform core job instead of Miri.
        run: |
          for test_module in \
            binary::tests \
            binary_writer::tests \
            candidate::tests \
            commit_state::tests \
            database_header::tests \
            error::tests \
            header::tests \
            jet3_page::tests \
            limits::tests \
            offset::tests \
            page::tests \
            raw_page_stream::tests \
            resource::tests
          do
            cargo +nightly-2026-07-20 miri test \
              --package jet3 --lib --all-features --locked "$test_module"
          done

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - run: cargo fmt --all --check
      - run: ./scripts/check-source-size.sh

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check
